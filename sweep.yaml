program: main.py
method: bayes
metric:
  name: validation_loss
  goal: minimize
parameters:
  batch_size:
    distribution: int_uniform
    min: 16
    max: 64
  num_layers:
    distribution: int_uniform
    min: 1
    max: 4
  architecture:
    distribution: categorical
    values:
      - GCN
      - GraphSAGE
  weight_decay:
    distribution: uniform
    min: 0.00025
    max: 0.001
  learning_rate:
    distribution: uniform
    min: 0.0005
    max: 0.2
  hidden_channels:
    distribution: int_uniform
    min: 32
    max: 128